<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Cover</title>
  
  <!-- Google Font: Lemon Milk -->
  <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Lemon Milk', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to bottom right, #001f3f, #004080, #0077b6);
    }

    .book-cover {
      width: 400px;
      height: 600px;
      background: linear-gradient(to bottom, #002244, #004466, #006699);
      color: white;
      border: 4px solid #00b4d8;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      padding: 20px;
      position: relative;
    }

    .header {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #b3e6ff;
      text-transform: uppercase;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 30px 0;
      line-height: 1.4;
      color: #00eaff;
      text-shadow: 0px 0px 8px #00c3ff;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 16px;
      text-align: center;
      margin-bottom: 30px;
      color: #d0f0ff;
    }

    .photo {
      width: 120px;
      height: 140px;
      margin: 0 auto;
      margin-top: 20px;
      border-radius: 10px; /* change to 50% for circular photo */
      overflow: hidden;
      border: 2px solid #00eaff;
      box-shadow: 0px 0px 10px #00c3ff;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .special {
      font-weight: bold;
      margin-top: 50px;
      font-size: 14px;
      color: #ccefff;
      text-transform: uppercase;
    }

    .author {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .publisher {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 14px;
      color: #aadfff;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="book-cover">
    <div class="header">SEC Insights</div>

    <div class="title">
      Fundamentals of <br> Web Application <br> Development
    </div>

    <div class="subtitle">
      Deep Dive in HTML, CSS & JS Basics <br>
      Top Seller of 2025
    </div>

    <!-- Replace "myphoto.jpg" with your own photo file -->
    <div class="photo">
      <img src="myphoto.jpeg" alt="Author Photo">
    </div>

    <div class="special">Special Edition</div>
    <div class="author">Amsavaradhan M</div>
    <div class="publisher">SEC</div>
  </div>
</body>
</html>
